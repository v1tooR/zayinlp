<!-- ============ CIDADES ============ -->
<section class="section" id="cidades">
  <div class="wrap">
    <div class="section-head split" data-reveal>
      <div>
        <p class="eyebrow">Onde atendemos</p>
        <h2 class="h-section">Atendemos o Vale do Paraíba, Mogi e o litoral</h2>
      </div>
      <p class="lede">Escolha sua cidade para ver a página com o contato certo.</p>
    </div>
    <nav class="route" aria-label="Cidades atendidas" data-reveal>
      <span class="route-road">Ao longo da Via Dutra, de Mogi a Pinda</span>
      {{ROUTE}}
    </nav>
    <p class="branch" data-reveal><svg aria-hidden="true"><use href="#i-road"/></svg>Litoral Norte também é atendido. Fale com a gente pelo WhatsApp.</p>
    <div class="contacts">
      {{CONTACTS}}
    </div>
  </div>
</section>
